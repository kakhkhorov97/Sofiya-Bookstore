name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sofiya
          POSTGRES_PASSWORD: sofiya
          POSTGRES_DB: sofiya_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sofiya" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://sofiya:sofiya@localhost:5432/sofiya_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --workspaces
      - run: npm run test --workspaces
      - run: npm run build
